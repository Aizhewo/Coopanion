plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.coopanion.androidpet'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.coopanion.androidpet'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
